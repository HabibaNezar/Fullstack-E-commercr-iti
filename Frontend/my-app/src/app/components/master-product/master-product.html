<div class="container mt-4">
  <!-- You PROJECT content INTO the card component -->

  <!-- Filter Dropdown -->
  <div class="mb-3 d-flex align-items-center gap-3">
    <label class="form-label mb-0 fw-bold">Filter by Category:</label>

    <select class="form-select w-auto" [(ngModel)]="selectedCategory">
      <option value="All">All</option>
      <option *ngFor="let cat of catList" [value]="cat.name">
        {{ cat.name }}
      </option>
    </select>
  </div>

  <!-- Add Product Button -->
  @if (isAdmin()) {
    <button class="btn btn-primary mb-3" (click)="addProduct()">Add New Product</button>
  }

  <!-- Product Form -->
  <div *ngIf="currentProduct.id !== 0 || isEditMode" class="card mb-3">
    <div class="card-header">
      <h5>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h5>
    </div>
    <div class="card-body">
      <form #productForm="ngForm">
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="title"
                [(ngModel)]="currentProduct.title"
                name="title"
                required
              />
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea
                class="form-control"
                id="description"
                [(ngModel)]="currentProduct.description"
                name="description"
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select
                class="form-select"
                id="category"
                [(ngModel)]="currentProduct.category"
                name="category"
              >
                <option *ngFor="let cat of catList" [value]="cat.name">{{ cat.name }}</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input
                type="number"
                class="form-control"
                id="price"
                [(ngModel)]="currentProduct.price"
                name="price"
                required
              />
            </div>
            <div class="mb-3">
              <label for="stock" class="form-label">Stock</label>
              <input
                type="number"
                class="form-control"
                id="stock"
                [(ngModel)]="currentProduct.stock"
                name="stock"
              />
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-3">
              <label for="brand" class="form-label">Brand</label>
              <input
                type="text"
                class="form-control"
                id="brand"
                [(ngModel)]="currentProduct.brand"
                name="brand"
              />
            </div>
            <div class="mb-3">
              <label for="rating" class="form-label">Rating</label>
              <input
                type="number"
                step="0.1"
                class="form-control"
                id="rating"
                [(ngModel)]="currentProduct.rating"
                name="rating"
              />
            </div>
            <div class="mb-3">
              <label for="discountPercentage" class="form-label">Discount %</label>
              <input
                type="number"
                class="form-control"
                id="discountPercentage"
                [(ngModel)]="currentProduct.discountPercentage"
                name="discountPercentage"
              />
            </div>
            <div class="mb-3">
              <label for="thumbnail" class="form-label">Thumbnail URL</label>
              <input
                type="text"
                class="form-control"
                id="thumbnail"
                [(ngModel)]="currentProduct.thumbnail"
                name="thumbnail"
              />
            </div>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-success"
          (click)="saveProduct()"
          [disabled]="!productForm.valid"
        >
          Save
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="cancelEdit()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Child Component -->
  <app-products
    [selectedCategory]="selectedCategory"
    (totalPrice)="RecievedTotalPrice($event)"
    (editProduct)="editProduct($event)"
    (deleteProduct)="deleteProduct($event)"
  >
  </app-products>
</div>
