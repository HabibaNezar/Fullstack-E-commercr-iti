<!-- master-products.component.html -->
<div class="master-products-page">
  <!-- ── CATEGORY FILTER CHIPS ── -->
  <div class="category-filter">
    <p class="category-filter-label">Browse by Category</p>
    <div class="category-chips">
      <!-- ALL chip -->
      <button
        class="chip"
        [class.active]="selectedCategory === 'All'"
        (click)="selectedCategory = 'All'"
      >
        All
      </button>

      <!-- Per-category chips -->
      <button
        *ngFor="let cat of catList"
        class="chip"
        [class.active]="selectedCategory === cat.name"
        (click)="selectedCategory = cat.name"
      >
        {{ cat.name }}
      </button>
    </div>
  </div>

  <!-- ── TOOLBAR ── -->
  <div class="toolbar">
    <div class="toolbar-left">
      @if (isAdmin()) {
        <button class="add-product-btn" (click)="addProduct()">
          <i class="ti ti-plus" aria-hidden="true"></i> Add Product
        </button>
      }
    </div>
  </div>

  <!-- ── PRODUCT FORM ── -->
  <div *ngIf="currentProduct.id !== 0 || isEditMode" class="form-card">
    <div class="form-card-header">
      <h5>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h5>
    </div>
    <div class="form-card-body">
      <form #productForm="ngForm">
        <div class="form-grid">
          <!-- LEFT COLUMN -->
          <div>
            <div class="form-group">
              <label for="title" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="title"
                [(ngModel)]="currentProduct.title"
                name="title"
                placeholder="Product title"
                required
              />
            </div>
            <div class="form-group">
              <label for="description" class="form-label">Description</label>
              <textarea
                class="form-control"
                id="description"
                [(ngModel)]="currentProduct.description"
                name="description"
                placeholder="Short description"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="category" class="form-label">Category</label>
              <select
                class="form-select"
                id="category"
                [(ngModel)]="currentProduct.category"
                name="category"
              >
                <option *ngFor="let cat of catList" [value]="cat.name">{{ cat.name }}</option>
              </select>
            </div>
            <div class="form-group">
              <label for="price" class="form-label">Price</label>
              <input
                type="number"
                class="form-control"
                id="price"
                [(ngModel)]="currentProduct.price"
                name="price"
                placeholder="0.00"
                required
              />
            </div>
            <div class="form-group">
              <label for="stock" class="form-label">Stock</label>
              <input
                type="number"
                class="form-control"
                id="stock"
                [(ngModel)]="currentProduct.stock"
                name="stock"
                placeholder="0"
              />
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div>
            <div class="form-group">
              <label for="brand" class="form-label">Brand</label>
              <input
                type="text"
                class="form-control"
                id="brand"
                [(ngModel)]="currentProduct.brand"
                name="brand"
                placeholder="Brand name"
              />
            </div>
            <div class="form-group">
              <label for="rating" class="form-label">Rating</label>
              <input
                type="number"
                step="0.1"
                class="form-control"
                id="rating"
                [(ngModel)]="currentProduct.rating"
                name="rating"
                placeholder="0.0 – 5.0"
              />
            </div>
            <div class="form-group">
              <label for="discountPercentage" class="form-label">Discount %</label>
              <input
                type="number"
                class="form-control"
                id="discountPercentage"
                [(ngModel)]="currentProduct.discountPercentage"
                name="discountPercentage"
                placeholder="0"
              />
            </div>
            <div class="form-group">
              <label for="thumbnail" class="form-label">Thumbnail URL</label>
              <input
                type="text"
                class="form-control"
                id="thumbnail"
                [(ngModel)]="currentProduct.thumbnail"
                name="thumbnail"
                placeholder="https://..."
              />
            </div>
          </div>
        </div>

        <!-- FORM ACTIONS -->
        <div class="form-actions">
          <button
            type="button"
            class="btn-save"
            (click)="saveProduct()"
            [disabled]="!productForm.valid"
          >
            <i class="ti ti-device-floppy" aria-hidden="true"></i> Save
          </button>
          <button type="button" class="btn-cancel" (click)="cancelEdit()">
            <i class="ti ti-x" aria-hidden="true"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── CHILD PRODUCTS COMPONENT ── -->
  <app-products
    [selectedCategory]="selectedCategory"
    (totalPrice)="RecievedTotalPrice($event)"
    (editProduct)="editProduct($event)"
    (deleteProduct)="deleteProduct($event)"
  >
  </app-products>
</div>
