<!-- cart.html — updated: Checkout button now routes to /checkout -->
<div class="cart-container">
  <div *ngIf="cartItems.length === 0" class="cart-empty">
    <div class="empty-icon"><i class="ti ti-shopping-bag"></i></div>
    <p class="empty-text">Your cart is empty.</p>
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="cart-header">
      <h1 class="cart-title">Your cart</h1>
      <span class="cart-count">{{ cartItems.length }} items</span>
    </div>

    <ul class="cart-list">
      <li *ngFor="let item of cartItems" class="cart-item">
        <div class="item-image">
          <img class="w-100" src="{{ item.images[0] }}" alt="{{ item.title }}" />
        </div>

        <div class="item-details">
          <p class="item-name">{{ item.title }}</p>
          <span class="item-price">${{ item.price * item.quantity | decimal }}</span>
        </div>

        <!-- ── Quantity Controls ── -->
        <div class="item-controls">
          <button class="qty-btn" (click)="decrement(item.id)">
            <i class="ti ti-minus"></i>
          </button>

          <span class="qty-value">{{ item.quantity }}</span>

          <button class="qty-btn" (click)="increment(item.id)">
            <i class="ti ti-plus"></i>
          </button>

          <button class="remove-btn" (click)="remove(item.id)">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </li>
    </ul>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span>
        <span>${{ totalPrice | decimal }}</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Free</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${{ totalPrice | decimal }}</span>
      </div>
    </div>

    <div class="cart-actions">
      <button class="btn-clear" (click)="clearCart()">
        <i class="ti ti-trash"></i> Clear cart
      </button>

      <!-- ✅ Updated: navigates to /checkout instead of doing nothing -->
      <button class="btn-checkout" routerLink="/checkout">
        <i class="ti ti-lock"></i> Checkout
      </button>
    </div>
  </div>
</div>
