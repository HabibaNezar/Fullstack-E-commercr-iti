<nav class="navbar">
  <!-- LOGO -->
  <a routerLink="/home" class="logo">ShopHub</a>

  <!-- CATEGORIES -->
  <div *ngIf="authService.isLoggedIn()" class="nav-categories">
    <a routerLink="/home">Home</a>
  </div>

  <!-- SEARCH BAR -->
  @if (isLoggedIn()) {
    <div class="nav-search">
      <input type="text" placeholder="Search Product..." />
      <button class="nav-search-btn" aria-label="Search">
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </button>
    </div>
  }

  <!-- ❌ GUEST -->
  <div *ngIf="!authService.isLoggedIn()" class="nav-links guest">
    <a routerLink="/login">Sign in</a>
    <a routerLink="/register">Get started</a>
  </div>

  <!-- ✅ LOGGED IN -->
  <div *ngIf="authService.isLoggedIn()" class="nav-links">
    <!-- 📦 My Orders — visible to all logged-in users -->
    <a routerLink="/my-orders" class="nav-orders-link"> 📦 My Orders </a>

    <!-- Cart -->
    <a routerLink="/cart" class="cart-link" aria-label="Cart">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <path d="M16 10a4 4 0 0 1-8 0" />
      </svg>
      <span class="cart-badge">{{ cartItemCount }}</span>
    </a>

    <!-- Profile -->
    <a routerLink="/profile" class="profile-link" aria-label="Account">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </a>

    <!-- 🛡️ ADMIN ONLY -->
    <ng-container *ngIf="authService.isAdmin()">
      <div class="nav-divider"></div>
      <div class="admin-links">
        <a routerLink="/users">👥 Users</a>
        <a routerLink="/dashboard">📊 Dashboard</a>
      </div>
    </ng-container>

    <div class="nav-divider"></div>
    <button class="btn-logout" (click)="logout()">Logout</button>
  </div>
</nav>
