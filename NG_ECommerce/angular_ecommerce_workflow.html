<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Angular E-Commerce Workflow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1e1e1e;
      --text: #cccccc;
      --text-dim: #888888;
      --border: #333333;
      --font-mono: Consolas, 'Courier New', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      padding: 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-header {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 30px;
      font-family: serif;
    }
    
    .top-header span {
      font-family: var(--font-mono);
    }

    .layout {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .sidebar {
      width: 250px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 15px;
      bottom: 15px;
      left: 0;
      width: 1px;
      background-color: var(--border);
    }

    .nav-item {
      position: relative;
      margin-bottom: 12px;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 50%;
      width: 20px;
      height: 1px;
      background-color: var(--border);
    }

    .nav-btn {
      width: 100%;
      background-color: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background-color: rgba(255, 255, 255, 0.03);
      border-color: #555;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .main-content {
      flex: 1;
      max-width: 650px;
    }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .header-sub {
      font-size: 12px;
      color: var(--text-dim);
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-done { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .status-next { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .status-todo { background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }

    .section-label {
      font-size: 11px;
      color: var(--text-dim);
      margin: 20px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .step-row {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }

    .step-number {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 10px;
    }

    .step-box {
      flex: 1;
      background-color: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
    }

    .s-label {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .s-file {
      font-size: 12px;
      color: #ffffff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .s-cmd {
      font-size: 11px;
      color: var(--text-dim);
    }

    .deps-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
    }

    .deps-title {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .deps-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dep-tag {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .concepts-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .concept-tag {
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .footer {
      margin-top: auto;
      padding-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-size: 16px;
      font-family: sans-serif;
    }
    
    .down-arrow {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="top-header">2. رسم ال <span>Workflow Diagram</span></div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">IMPLEMENTATION FLOW</div>
    <div class="timeline" id="nav"></div>
  </div>
  
  <div class="main-content" id="detail"></div>
</div>

<div class="footer">
  <div>جاهز وتفاعلي 🎉 Workflow Diagram ال</div>
  <div class="down-arrow">↓</div>
</div>

<script>
  const phases = [
    {
      id: 0, icon: '✅', title: 'Project Setup', sub: 'Already done',
      col: '#10b981', status: 'done',
      steps: [
        { label: 'Clone', file: 'git clone <repo>', cmd: 'git clone' },
        { label: 'Install', file: 'npm ci', cmd: 'installs 509 packages' },
        { label: 'Fix vulns', file: 'npm audit fix', cmd: '0 vulnerabilities' },
        { label: 'Run API', file: 'npm run json-server', cmd: 'localhost:3000' },
        { label: 'Run App', file: 'ng serve -o', cmd: 'localhost:4200' },
      ],
      concepts: ['Angular CLI', 'npm ci', 'JSON Server'],
      deps: []
    },
    {
      id: 1, icon: '📦', title: 'Order Management', sub: 'Section 4 — Start here',
      col: '#3b82f6', status: 'next',
      steps: [
        { label: 'Model', file: 'models/order.model.ts', cmd: 'ng g interface models/order' },
        { label: 'Service', file: 'services/order.service.ts', cmd: 'ng g service services/order' },
        { label: 'Checkout page', file: 'components/checkout/', cmd: 'ng g component components/checkout' },
        { label: 'My orders page', file: 'components/my-orders/', cmd: 'ng g component components/my-orders' },
        { label: 'Order tracking', file: 'components/order-tracking/', cmd: 'ng g component components/order-tracking' },
        { label: 'Routes', file: 'app.routes.ts', cmd: 'add checkout + my-orders + tracking' },
        { label: 'JSON data', file: 'products.json', cmd: 'add "orders":[] array' },
      ],
      concepts: ['HttpClient CRUD', 'Reactive Forms', 'Route Params', 'RxJS'],
      deps: ['AuthService', 'CartService']
    },
    {
      id: 2, icon: '🛡️', title: 'Admin Panel', sub: 'Section 6 — Full control',
      col: '#ef4444', status: 'todo',
      steps: [
        { label: 'Guard', file: 'guards/admin.guard.ts', cmd: 'ng g guard guards/admin' },
        { label: 'Dashboard', file: 'components/admin/admin-dashboard/', cmd: 'ng g component components/admin/admin-dashboard' },
        { label: 'Users mgmt', file: 'components/admin/admin-users/', cmd: 'ng g component components/admin/admin-users' },
        { label: 'Orders mgmt', file: 'components/admin/admin-orders/', cmd: 'ng g component components/admin/admin-orders' },
        { label: 'Products mgmt', file: 'components/admin/admin-products/', cmd: 'ng g component components/admin/admin-products' },
        { label: 'Child routes', file: 'app.routes.ts', cmd: 'add /admin with children[]' },
        { label: 'Navbar link', file: 'components/navbar/', cmd: 'show link if role===admin' },
      ],
      concepts: ['CanActivate Guard', 'Child Routes', 'NgClass', 'forkJoin'],
      deps: ['OrderService', 'UserService', 'ProductService']
    },
    {
      id: 3, icon: '💳', title: 'Payment Integration', sub: 'Section 5 — Stripe / Cash',
      col: '#a855f7', status: 'todo',
      steps: [
        { label: 'Install Stripe', file: 'npm install @stripe/stripe-js', cmd: 'adds Stripe SDK' },
        { label: 'Environment', file: 'environments/environment.ts', cmd: 'add stripePublicKey' },
        { label: 'Service', file: 'services/payment.service.ts', cmd: 'ng g service services/payment' },
        { label: 'Stripe form', file: 'components/payment/stripe-form/', cmd: 'ng g component components/payment/stripe-form' },
        { label: 'Success page', file: 'components/payment/payment-success/', cmd: 'ng g component components/payment/payment-success' },
        { label: 'Checkout update', file: 'components/checkout/checkout.ts', cmd: 'add payment method toggle' },
      ],
      concepts: ['Async/Await', 'EventEmitter', 'Environment vars', '@Output'],
      deps: ['OrderService', 'Checkout component']
    },
    {
      id: 4, icon: '🏪', title: 'Seller Management', sub: 'Section 7 — Multi-vendor',
      col: '#14b8a6', status: 'todo',
      steps: [
        { label: 'Model', file: 'models/seller.model.ts', cmd: 'ng g interface models/seller' },
        { label: 'Guard', file: 'guards/seller.guard.ts', cmd: 'ng g guard guards/seller' },
        { label: 'Service', file: 'services/seller.service.ts', cmd: 'ng g service services/seller' },
        { label: 'Register page', file: 'components/seller/seller-register/', cmd: 'ng g component components/seller/seller-register' },
        { label: 'Dashboard', file: 'components/seller/seller-dashboard/', cmd: 'ng g component components/seller/seller-dashboard' },
        { label: 'Seller products', file: 'components/seller/seller-products/', cmd: 'ng g component components/seller/seller-products' },
        { label: 'JSON data', file: 'products.json', cmd: 'add "sellers":[] array' },
        { label: 'Routes', file: 'app.routes.ts', cmd: 'add /seller with children[]' },
      ],
      concepts: ['Role-Based Access', 'CanActivate', 'Input/Output', 'RouterModule'],
      deps: ['AuthService', 'ProductService', 'OrderService']
    },
    {
      id: 5, icon: '🎯', title: 'Marketing & Bonus', sub: 'Coupons, banners, discounts',
      col: '#f59e0b', status: 'todo',
      steps: [
        { label: 'Coupon service', file: 'services/coupon.service.ts', cmd: 'ng g service services/coupon' },
        { label: 'Coupon input', file: 'components/coupon/', cmd: 'ng g component components/coupon' },
        { label: 'Promo banner', file: 'components/promo-banner/', cmd: 'ng g component components/promo-banner' },
        { label: 'Discount pipe', file: 'pipes/discount.pipe.ts', cmd: 'ng g pipe pipes/discount' },
        { label: 'JSON data', file: 'products.json', cmd: 'add "coupons":[] array' },
        { label: 'App html', file: 'app.component.html', cmd: 'add <app-promo-banner>' },
      ],
      concepts: ['Pipe Transform', 'BehaviorSubject', 'ngClass', 'LocalStorage'],
      deps: ['CartService', 'Checkout component']
    }
  ];

  let active = 0;

  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = phases.map((p, i) => `
      <div class="nav-item">
        <button class="nav-btn ${active === i ? 'active' : ''}" onclick="setActive(${i})">
          <div class="dot" style="background-color: ${p.col}"></div>
          <span>${p.icon} ${p.title}</span>
        </button>
      </div>
    `).join('');
  }

  function renderDetail() {
    const p = phases[active];
    const statusLabel = { done: '☑ Completed', next: '▶ Start here', todo: '⏳ Upcoming' };
    const statusClass = { done: 'status-done', next: 'status-next', todo: 'status-todo' };
    
    let html = `
      <div class="header-card">
        <div class="header-left">
          <div class="header-icon">${p.icon}</div>
          <div>
            <div class="header-title">${p.title}</div>
            <div class="header-sub">${p.sub}</div>
          </div>
        </div>
        <div class="status-badge ${statusClass[p.status]}">${statusLabel[p.status]}</div>
      </div>

      <div class="section-label">STEPS</div>
    `;

    p.steps.forEach((s, i) => {
      html += `
        <div class="step-row" style="--accent: ${p.col}">
          <div class="step-number">${i + 1}</div>
          <div class="step-box">
            <div class="s-label">${s.label}</div>
            <div class="s-file">${s.file}</div>
            <div class="s-cmd">${s.cmd}</div>
          </div>
        </div>
      `;
    });

    if (p.deps.length > 0) {
      html += `
        <div class="deps-box">
          <div class="deps-title">DEPENDS ON</div>
          <div class="deps-list">
            ${p.deps.map(d => `<div class="dep-tag">${d}</div>`).join('')}
          </div>
        </div>
      `;
    }

    html += `
      <div class="section-label" style="margin-top: 25px;">ANGULAR CONCEPTS</div>
      <div class="concepts-list" style="--accent: ${p.col}">
        ${p.concepts.map(c => `<div class="concept-tag">${c}</div>`).join('')}
      </div>
    `;

    document.getElementById('detail').innerHTML = html;
  }

  function setActive(i) {
    active = i;
    renderNav();
    renderDetail();
  }

  // Initialize
  renderNav();
  renderDetail();
</script>

</body>
</html>
